<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Pessoa - CRUD</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header>
    <h1>CRUD - Cadastro de Pessoas</h1>
  </header>

  <nav>
    <a href="../get/index.html">Listar (GET)</a>
    <a href="../post/index.html">Adicionar (POST)</a>
    <a href="../put/index.html" class="active">Editar (PUT)</a>
    <a href="../delete/index.html">Excluir (DELETE)</a>
  </nav>

  <main>
    <h2>Editar registro existente</h2>

    <div class="search-box">
      <input type="text" id="buscaCpf" placeholder="Digite o CPF da pessoa a editar" />
      <button class="btn-primary" id="btnBuscar">Buscar</button>
    </div>

    <form id="formEdicao" style="display: none">
      <input type="hidden" id="id" />
      <div>
        <label for="nome">Nome</label>
        <input type="text" id="nome" required />
      </div>
      <div>
        <label for="sobrenome">Sobrenome</label>
        <input type="text" id="sobrenome" required />
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div>
        <label for="idade">Idade</label>
        <input type="number" id="idade" min="0" required />
      </div>
      <div>
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" required />
      </div>
      <div>
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" required />
      </div>
      <div>
        <label for="rg">RG</label>
        <input type="text" id="rg" required />
      </div>
      <div>
        <label for="rua">Rua</label>
        <input type="text" id="rua" required />
      </div>
      <div>
        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" required />
      </div>
      <div>
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" required />
      </div>
      <div>
        <label for="estado">Estado (UF)</label>
        <input type="text" id="estado" maxlength="2" required />
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary">Atualizar</button>
      </div>
    </form>

    <div class="msg" id="mensagem"></div>
  </main>

  <footer>JSON Server + Express &middot; Render</footer>

  <script src="../put/put.js"></script>
</body>
</html>
